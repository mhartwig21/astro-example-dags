<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300">
  <!-- The trader: hooded, half-lit smile, a coin walking its knuckle glint.
       Distinctive silhouette: deep hood, high collar, gold catchlights. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.36" r="0.85">
      <stop offset="0" stop-color="#33281a"/>
      <stop offset="0.55" stop-color="#1e1710"/>
      <stop offset="1" stop-color="#0f0b08"/>
    </radialGradient>
  </defs>
  <rect width="240" height="300" fill="url(#bg)"/>
  <ellipse cx="120" cy="96" rx="90" ry="80" fill="#c9a24b" opacity="0.07"/>
  <!-- cloaked shoulders, high collar -->
  <path d="M30 300 L38 246 C46 214 76 198 100 194 L140 194 C164 198 194 214 202 246 L210 300 Z"
        fill="#4a3820" stroke="#150e07" stroke-width="7" stroke-linejoin="round"/>
  <path d="M30 300 L38 246 C44 220 64 206 86 198 C72 220 64 258 62 300 Z" fill="#6e5533"/>
  <path d="M210 300 L202 246 C196 222 180 208 162 200 C176 226 182 262 184 300 Z" fill="#2c2013"/>
  <!-- coin purse strap -->
  <path d="M96 196 L172 268" stroke="#150e07" stroke-width="14"/>
  <path d="M96 196 L172 268" stroke="#8a6d3b" stroke-width="8"/>
  <!-- THE HOOD: deep, peaked, swallows the brow -->
  <path d="M62 138 C48 84 76 34 120 30 C164 34 192 84 178 138 C174 160 162 172 150 178 L90 178 C78 172 66 160 62 138 Z"
        fill="#6e5533" stroke="#150e07" stroke-width="7" stroke-linejoin="round"/>
  <path d="M120 30 C164 34 192 84 178 138 C174 160 162 172 150 178 L132 178 C152 168 166 146 168 116 C170 78 150 44 120 30 Z" fill="#453520"/>
  <path d="M70 120 C64 78 86 42 118 34 C94 48 80 80 82 118 C82 134 86 150 94 162 C80 154 72 138 70 120 Z" fill="#a8854f" opacity="0.9"/>
  <!-- hood interior: near-black -->
  <path d="M86 118 C84 84 100 58 120 54 C140 58 156 84 154 118 C152 146 140 166 120 170 C100 166 88 146 86 118 Z"
        fill="#17110a" stroke="#150e07" stroke-width="6"/>
  <!-- lower face catching the light: chin, mouth, nose tip -->
  <path d="M98 128 C100 148 108 160 120 162 C132 160 140 148 142 128 C134 122 106 122 98 128 Z" fill="#c9986a" stroke="#150e07" stroke-width="5" stroke-linejoin="round"/>
  <path d="M120 162 C132 160 140 148 142 128 C138 125 130 123 122 123 C124 138 123 152 120 162 Z" fill="#8a5f3d"/>
  <!-- the merchant's half-smile -->
  <path d="M104 142 C112 148 130 148 138 141" stroke="#150e07" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M132 145 C135 147 137 149 138 152" stroke="#150e07" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- eye glints in the hood dark -->
  <ellipse cx="104" cy="102" rx="6" ry="4" fill="#f2c14e"/>
  <ellipse cx="138" cy="102" rx="6" ry="4" fill="#c9a24b"/>
  <ellipse cx="102" cy="100" rx="2" ry="1.5" fill="#fff8e6"/>
  <ellipse cx="136" cy="100" rx="2" ry="1.5" fill="#fff8e6"/>
  <!-- raised hand flipping a coin -->
  <g stroke="#150e07" stroke-linejoin="round">
    <path d="M176 230 C170 218 172 206 182 200 C194 196 206 202 210 214 C214 228 206 240 194 242 C186 242 179 238 176 230 Z"
          fill="#c9986a" stroke-width="7"/>
    <path d="M182 200 C194 196 206 202 210 214 C212 224 208 233 200 238 C204 226 200 210 190 202 Z" fill="#8a5f3d" stroke="none"/>
    <circle cx="196" cy="176" r="15" fill="#f2c14e" stroke-width="6"/>
    <circle cx="196" cy="176" r="8" fill="none" stroke="#a8854f" stroke-width="3"/>
    <path d="M191 170 C193 168 199 168 201 170" stroke="#fff8e6" stroke-width="3" fill="none"/>
  </g>
  <rect y="240" width="240" height="60" fill="#0e0b09" opacity="0.35"/>
</svg>
