<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300">
  <!-- The quartermaster: broad, shaved head, bandage-roll over the shoulder,
       no-nonsense stare. Field-hospital leather + linen. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.36" r="0.85">
      <stop offset="0" stop-color="#2b2a1e"/>
      <stop offset="0.55" stop-color="#1b1a12"/>
      <stop offset="1" stop-color="#0e0d08"/>
    </radialGradient>
  </defs>
  <rect width="240" height="300" fill="url(#bg)"/>
  <ellipse cx="70" cy="80" rx="86" ry="70" fill="#6da356" opacity="0.06"/>
  <!-- massive shoulders, leather apron -->
  <path d="M22 300 L32 240 C42 208 74 194 100 190 L140 190 C170 194 200 208 208 240 L218 300 Z"
        fill="#453520" stroke="#150e07" stroke-width="7" stroke-linejoin="round"/>
  <path d="M22 300 L32 240 C40 214 62 200 88 193 C70 216 60 258 58 300 Z" fill="#6e5533"/>
  <path d="M218 300 L208 240 C202 218 186 205 168 197 C182 226 190 262 192 300 Z" fill="#2c2013"/>
  <!-- apron bib -->
  <path d="M92 210 L92 300 L148 300 L148 210 C132 202 108 202 92 210 Z" fill="#8c7a58" stroke="#150e07" stroke-width="6" stroke-linejoin="round"/>
  <path d="M120 206 L120 300 L148 300 L148 210 C139 205 129 204 120 206 Z" fill="#6b5c42"/>
  <!-- bandage roll slung over the left shoulder -->
  <path d="M56 196 C74 232 100 262 132 288" stroke="#150e07" stroke-width="18" fill="none"/>
  <path d="M56 196 C74 232 100 262 132 288" stroke="#d9d2c2" stroke-width="11" fill="none"/>
  <path d="M62 208 L72 202 M74 224 L84 217 M90 240 L99 232 M106 254 L114 246" stroke="#a29a8a" stroke-width="4"/>
  <!-- neck: a pillar -->
  <path d="M100 168 L100 200 C110 208 130 208 140 200 L140 168 Z" fill="#a97c50" stroke="#150e07" stroke-width="7"/>
  <!-- head: square, shaved -->
  <path d="M80 92 C78 56 96 36 120 36 C144 36 162 56 160 92 C159 122 148 146 120 148 C92 146 81 122 80 92 Z"
        fill="#c9986a" stroke="#150e07" stroke-width="7" stroke-linejoin="round"/>
  <path d="M120 36 C144 36 162 56 160 92 C159 122 148 146 120 148 L120 36 Z" fill="#8a5f3d" opacity="0.55"/>
  <path d="M86 76 C88 56 100 44 114 42 C104 54 98 70 96 90 C92 88 88 84 86 76 Z" fill="#eec392" opacity="0.85"/>
  <!-- shaved scalp sheen -->
  <path d="M88 58 C96 46 108 40 120 40 C132 40 144 46 152 58 C142 50 130 47 120 47 C110 47 98 50 88 58 Z" fill="#eec392" opacity="0.6"/>
  <!-- ear notch (took a bite once) -->
  <path d="M74 96 C68 100 66 110 72 116 L78 108 L74 104 Z" fill="#a97c50" stroke="#150e07" stroke-width="5"/>
  <path d="M166 96 C172 100 174 110 168 116 C164 110 162 100 166 96 Z" fill="#8a5f3d" stroke="#150e07" stroke-width="5"/>
  <!-- flat disapproving brows -->
  <path d="M88 88 L112 86 L112 95 L90 96 Z" fill="#150e07"/>
  <path d="M152 88 L128 86 L128 95 L150 96 Z" fill="#150e07"/>
  <!-- narrowed appraising eyes -->
  <path d="M92 102 C98 99 106 99 110 102 C106 107 96 107 92 102 Z" fill="#150e07"/>
  <path d="M130 102 C136 99 144 99 148 102 C144 107 134 107 130 102 Z" fill="#150e07"/>
  <!-- broken nose -->
  <path d="M118 98 C115 110 112 118 109 124 C114 129 126 129 131 124 C127 116 124 108 122 98 Z" fill="#8a5f3d" opacity="0.75"/>
  <path d="M116 104 L124 108" stroke="#150e07" stroke-width="4" stroke-linecap="round"/>
  <!-- set jaw, thin mouth -->
  <path d="M102 134 L138 134" stroke="#150e07" stroke-width="5" stroke-linecap="round"/>
  <path d="M100 140 C108 145 132 145 140 140" stroke="#8a5f3d" stroke-width="4" fill="none" opacity="0.7"/>
  <!-- cheek plaster: their own product -->
  <rect x="138" y="112" width="22" height="10" rx="2" fill="#d9d2c2" stroke="#150e07" stroke-width="4" transform="rotate(-14 149 117)"/>
  <rect y="240" width="240" height="60" fill="#0e0b09" opacity="0.35"/>
</svg>
