<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300">
  <!-- The rumor-monger: wide-brim hat, scarf over the mouth, one arched brow.
       Cool lore-blue accents in the warm dark — information has a color. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.36" r="0.85">
      <stop offset="0" stop-color="#232030"/>
      <stop offset="0.55" stop-color="#171522"/>
      <stop offset="1" stop-color="#0c0b12"/>
    </radialGradient>
  </defs>
  <rect width="240" height="300" fill="url(#bg)"/>
  <ellipse cx="170" cy="90" rx="80" ry="66" fill="#5a87c6" opacity="0.08"/>
  <!-- narrow cloaked shoulders -->
  <path d="M40 300 L48 248 C56 218 82 202 104 198 L136 198 C160 202 186 218 194 248 L200 300 Z"
        fill="#2f2a3c" stroke="#150e07" stroke-width="7" stroke-linejoin="round"/>
  <path d="M40 300 L48 248 C54 226 70 212 90 202 C76 226 68 262 66 300 Z" fill="#4a4260"/>
  <path d="M200 300 L194 248 C188 226 174 212 158 204 C170 230 176 264 178 300 Z" fill="#1e1a2a"/>
  <!-- THE SCARF: wraps the neck and lower face -->
  <path d="M84 150 C88 178 100 196 120 198 C140 196 152 178 156 150 C146 140 94 140 84 150 Z"
        fill="#5a87c6" stroke="#150e07" stroke-width="7" stroke-linejoin="round"/>
  <path d="M120 198 C140 196 152 178 156 150 C150 144 138 141 126 140 C130 162 127 184 120 198 Z" fill="#3c5f93"/>
  <path d="M88 156 C96 152 112 150 120 151 M92 168 C100 164 112 163 120 164" stroke="#150e07" stroke-width="4" fill="none" opacity="0.7"/>
  <!-- scarf tail flying off the shoulder -->
  <path d="M152 168 C176 172 196 186 204 208 C188 204 168 198 156 186 Z" fill="#5a87c6" stroke="#150e07" stroke-width="6" stroke-linejoin="round"/>
  <path d="M170 182 C184 188 196 198 202 206 C190 202 176 194 168 188 Z" fill="#3c5f93"/>
  <!-- upper face -->
  <path d="M86 96 C84 66 100 48 120 48 C140 48 156 66 154 96 C153 118 146 138 120 142 C94 138 87 118 86 96 Z"
        fill="#c9986a" stroke="#150e07" stroke-width="7" stroke-linejoin="round"/>
  <path d="M120 48 C140 48 156 66 154 96 C153 118 146 138 120 142 L120 48 Z" fill="#8a5f3d" opacity="0.55"/>
  <!-- one arched brow, one flat: the connoisseur of secrets -->
  <path d="M90 90 C96 80 108 78 114 84 L112 92 C106 88 96 90 92 96 Z" fill="#150e07"/>
  <path d="M128 88 L150 90 L150 97 L128 95 Z" fill="#150e07"/>
  <!-- sly sidelong eyes -->
  <path d="M94 102 C99 98 108 98 112 102 C108 107 98 107 94 102 Z" fill="#150e07"/>
  <ellipse cx="106" cy="101" rx="2" ry="1.6" fill="#5a87c6"/>
  <path d="M132 102 C137 98 146 98 150 102 C146 107 136 107 132 102 Z" fill="#150e07"/>
  <ellipse cx="144" cy="101" rx="2" ry="1.6" fill="#5a87c6"/>
  <!-- nose bridge into the scarf -->
  <path d="M118 100 C116 112 114 122 112 130 C116 133 124 133 128 130 C125 120 123 110 122 100 Z" fill="#8a5f3d" opacity="0.7"/>
  <!-- THE HAT: wide brim, low crown, a document tucked in the band -->
  <g stroke="#150e07" stroke-linejoin="round">
    <path d="M42 84 C68 74 92 70 120 70 C148 70 172 74 198 84 C200 92 196 98 188 99 C144 88 96 88 52 99 C44 98 40 92 42 84 Z"
          fill="#2f2a3c" stroke-width="7"/>
    <path d="M78 74 C80 52 96 38 120 38 C144 38 160 52 162 74 C148 70 134 68 120 68 C106 68 92 70 78 74 Z"
          fill="#3c3552" stroke-width="7"/>
    <path d="M120 38 C144 38 160 52 162 74 C150 70 138 69 126 68 C128 56 126 46 120 38 Z" fill="#241f33" stroke="none"/>
    <path d="M78 68 C106 62 134 62 162 68 L161 76 C134 70 106 70 79 76 Z" fill="#5a87c6" stroke-width="5"/>
    <!-- the tucked note -->
    <path d="M148 56 L166 50 L168 66 L152 70 Z" fill="#d9d2c2" stroke-width="5"/>
  </g>
  <path d="M44 86 C70 77 94 73 120 73 C110 76 96 80 86 86 C72 88 56 90 46 94 Z" fill="#4a4260" opacity="0.9"/>
  <rect y="240" width="240" height="60" fill="#0c0b12" opacity="0.4"/>
</svg>
