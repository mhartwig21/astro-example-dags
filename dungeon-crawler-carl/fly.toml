# Fly.io config for Dungeon Crawler Claude.
# Deploy: `fly launch --copy-config --no-deploy` once, then `fly deploy`.
# The app name below must be globally unique — change it if taken.

app = "dungeon-crawler-claude"
primary_region = "ord"  # pick the region closest to your party
# Stop grace: the server checkpoints every live character save on SIGINT
# before exiting (gameServer.ts shutdown handler) — give it room to finish.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# Persistent disk: the daily-crawl leaderboard lives here so a deploy no longer
# wipes the boards (volume `dcc_data`, created in ord; Fly snapshots it daily).
[mounts]
  source = "dcc_data"
  destination = "/data"

[env]
  LEADERBOARD_FILE = "/data/leaderboard.json"
  DB_FILE = "/data/dcc.sqlite"

# Fly scrapes this into its managed Prometheus/Grafana (fly-metrics.net):
# tick cost, snapshot bytes, players/instances, joins, run outcomes.
[metrics]
  port = 8080
  path = "/metrics"

[http_service]
  internal_port = 8080
  force_https = true
  # A live game server should not scale to zero mid-run; keep exactly one
  # machine (in-memory party instances live in this process).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "3s"
  method = "GET"
  path = "/health"

# Sizing (measured 2026-08-01, DEPLOY.md capacity table): CPU is ~7% of the
# tick budget at 48 players, so shared-cpu-1x stays right. Memory goes to 1GB:
# RSS hit 155MB at 48 players and permessage-deflate adds ~150KB/connection —
# 1GB makes an OOM restart (which wipes live parties) unreachable at any load
# the wire can carry. NEVER scale count past exactly 1 machine — party state
# is in-memory; see DEPLOY.md scale-up runbook for the vm/memory commands.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
